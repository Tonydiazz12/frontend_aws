<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directorio de Contactos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container mt-5">
        <div class="glass-card p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="text-white">Directorio de Contactos</h2>
                <button class="btn btn-light" data-bs-toggle="modal" data-bs-target="#contactoModal" onclick="limpiarFormulario()">
                    + Nuevo Contacto
                </button>
            </div>
            
            <div class="table-responsive">
                <table class="table table-borderless text-white glass-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre Completo</th>
                            <th>Teléfono</th>
                            <th>Email</th>
                            <th>Categoría</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaContactos">
                        <!-- Los contactos se inyectarán aquí -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal para Agregar/Editar -->
    <div class="modal fade" id="contactoModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content glass-modal text-white">
                <div class="modal-header border-0">
                    <h5 class="modal-title" id="modalTitle">Nuevo Contacto</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formContacto">
                        <input type="hidden" id="contactoId">
                        <div class="mb-3">
                            <input type="text" class="form-control glass-input" id="nombre" placeholder="Nombre" required>
                        </div>
                        <div class="mb-3">
                            <input type="text" class="form-control glass-input" id="apPaterno" placeholder="Apellido Paterno" required>
                        </div>
                        <div class="mb-3">
                            <input type="text" class="form-control glass-input" id="apMaterno" placeholder="Apellido Materno">
                        </div>
                        <div class="mb-3">
                            <input type="email" class="form-control glass-input" id="email" placeholder="Email">
                        </div>
                        <div class="mb-3">
                            <input type="text" class="form-control glass-input" id="telefono" placeholder="Teléfono">
                        </div>
                        <div class="mb-3">
                            <select class="form-control glass-input" id="categoria" required>
                                <!-- Categorías inyectadas dinámicamente -->
                            </select>
                        </div>
                        <button type="submit" class="btn btn-light w-100">Guardar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/app.js"></script>
</body>
</html>
